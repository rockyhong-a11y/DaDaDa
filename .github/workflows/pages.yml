name: Deploy to GitHub Pages

# Pages 소스를 "GitHub Actions" 로 바꿨을 때 쓰는 배포 경로다.
#
# 지금 저장소는 "Deploy from a branch" 로 설정돼 있어 GitHub 이 알아서
# 브랜치 내용을 배포한다. 그 상태에서 이 워크플로까지 push 마다 돌면
# 배포가 두 번 일어나 어느 쪽이 최종본인지 정해지지 않으므로,
# 기본은 수동 실행으로 둔다.
#
# Settings → Pages → Source 를 "GitHub Actions" 로 바꿨다면
# 아래 push 트리거의 주석을 풀어 자동 배포로 전환하면 된다.
on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main
  #     - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
